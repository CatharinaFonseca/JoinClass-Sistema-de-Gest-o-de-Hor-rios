<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoinClass - Horário Acadêmico</title>
    <!-- Vinculando nosso arquivo de estilo centralizado -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Cabeçalho Principal -->
    <header class="main-header">
        <div class="logo-container">
            <span class="logo-text-join">Join</span><span class="logo-text-class">Class</span>
        </div>
        <h1 class="header-title-schedule">Horário Acadêmico</h1>
    </header>

    <!-- Conteúdo Principal - Tabela de Horários -->
    <main class="container schedule-container">
        
       
        <table border="1" style="width:100%; margin-top:20px;">
    <thead>
        <tr>
            <th>Dia</th>
            <th>Horário</th>
            <th>Disciplina</th>
            <th>Professor</th>
        </tr>
    </thead>
    <tbody id="tabela-horarios"></tbody>
</table>
    </thead>

    <tbody id="tabela-horarios"></tbody>
</table>
    </main>
<script>
async function carregarHorarios() {
    try {
        const response = await fetch("http://localhost:5036/api/horarios");

        if (!response.ok) {
            throw new Error("Erro na API: " + response.status);
        }

        const horarios = await response.json();

        const tbody = document.getElementById("tabela-horarios");

        tbody.innerHTML = "";

        horarios.forEach(h => {
            const linha = `
                <tr>
                    <td>${h.dia_semana}</td>
                    <td>${h.horario_inicio} - ${h.horario_fim}</td>
                    <td>${h.disciplina ?? "-"}</td>
                    <td>${h.professor ?? "-"}</td>
                </tr>
            `;

            tbody.innerHTML += linha;
        });

    } catch (err) {
        console.error(err);
        alert("Erro ao carregar horários");
    }
}

window.onload = carregarHorarios;
</script>
</body>
</html>
