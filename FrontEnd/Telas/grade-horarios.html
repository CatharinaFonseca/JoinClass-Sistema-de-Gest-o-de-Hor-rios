<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>grade</title>

    <link rel="stylesheet" type="text/css" href="CSS/JoinClass.css">
</head>
<body class="BodyAcesso">

    <div class="TopoAcesso">
        <a href="JoinClass.html">
    <img src="img/JCLogoSF.png" alt="Logo" class="LogoLogin">
        </a>
    </div>

    <div class="CardGradeHorario">

        <h1>Grade de Horários</h1>

        <div class="BotaoCarregar">
            <button onclick="buscarEPreencherHorarios(3)">
                Exibir Horário da Turma 3
            </button>
        </div>

        <table class="TabelaHorario">

            <thead>
                <tr>
                    <th>Horário</th>
                    <th>Segunda</th>
                    <th>Terça</th>
                    <th>Quarta</th>
                    <th>Quinta</th>
                    <th>Sexta</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td class="HorarioColuna">19:00 - 20:40</td>
                    <td id="Segunda-19:00"></td>
                    <td id="Terça-19:00"></td>
                    <td id="Quarta-19:00"></td>
                    <td id="Quinta-19:00"></td>
                    <td id="Sexta-19:00"></td>
                </tr>

                <tr>
                    <td class="HorarioColuna">20:50 - 22:30</td>
                    <td id="Segunda-20:50"></td>
                    <td id="Terça-20:50"></td>
                    <td id="Quarta-20:50"></td>
                    <td id="Quinta-20:50"></td>
                    <td id="Sexta-20:50"></td>
                </tr>

            </tbody>

        </table>

    </div>

<script>

const API_URL = "http://localhost:5036/api";

async function buscarEPreencherHorarios(idTurma) {

    try {

        const resposta = await fetch(`${API_URL}/horarios`);

        if (!resposta.ok)
            throw new Error("Erro ao buscar horários");

        const todosHorarios = await resposta.json();

        limparGrade();

        const horariosFiltrados = todosHorarios.filter(h => {

            const idTurmaObjeto =
                h.id_turma ||
                h.idTurma ||
                (h.turma ? h.turma.id : null);

            return idTurmaObjeto == idTurma;
        });

        horariosFiltrados.forEach(h => {

            let diaSemana =
                h.dia_semana ||
                h.Dia_semana ||
                h.diaSemana ||
                h.DiaSemana;

            if (diaSemana && diaSemana.includes("-feira")) {
                diaSemana = diaSemana.split("-")[0];
            }

            let horarioInicio =
                h.horario_inicio ||
                h.Horario_inicio ||
                h.horarioInicio ||
                h.HorarioInicio;

            if (horarioInicio &&
                horarioInicio.split(":").length === 3) {

                const partes = horarioInicio.split(":");

                horarioInicio =
                    `${partes[0]}:${partes[1]}`;
            }

            const celula =
                document.getElementById(
                    `${diaSemana}-${horarioInicio}`
                );

            if (celula) {

                const nomeMateria =
                    h.disciplina || "Sem Disciplina";

                const nomeProfessor =
                    h.professor || "Sem Professor";

                celula.innerHTML = `
                    <div class="AulaCard">
                        <div class="AulaMateria">
                            ${nomeMateria}
                        </div>

                        <span class="AulaProfessor">
                            👤 ${nomeProfessor}
                        </span>
                    </div>
                `;
            }

        });

    } catch (erro) {

        console.error(erro);

        alert("Não foi possível carregar a grade.");

    }

}

function limparGrade() {

    const dias = [
        'Segunda',
        'Terça',
        'Quarta',
        'Quinta',
        'Sexta'
    ];

    const horas = [
        '19:00',
        '20:50'
    ];

    dias.forEach(d => {

        horas.forEach(h => {

            const celula =
                document.getElementById(`${d}-${h}`);

            if (celula)
                celula.innerHTML = "";

        });

    });

}

</script>

</body>
</html>
