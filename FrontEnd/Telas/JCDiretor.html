<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Diretor</title>

<link rel="stylesheet" type="text/css" href="CSS/JoinClass.css">
</head>
<body class="BodyDiretor">

	<div class="TopoDiretor">
        <a href="JoinClass.html">
    <img src="img/JCLogoSF.png" alt="Logo" class="LogoLogin">
        </a>
    </div>

    	<h1 class="TituloDiretor">Diretor</h1>
    
    <div class="CardLogin">

        <h1>Coordenador</h1>

        	<div class="LinhaCampos">

    <div class="CampoNome">
        <label>Nome:</label>
        <input type="text" id="nome">
    </div>

    <div class="CampoTitulacao">
        <label>E-mail:</label>
        <input type="email" id="email">
    </div>

		</div>

    

         <div class="BotaoEnviar">

            <button type="button" onclick="cadastrarCoordenador()">Cadastrar</button>

             <!-- Lista-->
            <h2>Lista de Coordenadores</h2>
            <table id="tabelaCoordenadores" border="1" style="width:100%; margin-top:10px;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela"></tbody>
            </table>


        </div>
    </div>

     <script>
        function cadastrarCoordenador() {
        const nome = document.getElementById("nome").value;
        const email = document.getElementById("email").value;

        fetch("http://localhost:5036/api/coordenadores", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nome: nome,
                email: email
            })
        })
        .then(res => {
            if (res.ok) {
                alert("Coordenador cadastrado!");
                carregarCoordenadores();
            } else {
                alert("Erro ao cadastrar");
            }
        });
    }

    function carregarCoordenadores() {
        fetch("http://localhost:5036/api/coordenadores")
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById("corpoTabela");
                tbody.innerHTML = "";

                data.forEach(cood => {
                    const tr = document.createElement("tr");

                    tr.innerHTML = `
                        <td>${cood.id}</td>
                        <td>${cood.nome}</td>
                        <td>${cood.email}</td>
                        <td>
                            <button onclick="excluirCoordenador(${cood.id})">
                                Excluir
                            </button>
                        </td>
                    `;

                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                console.error(err);
                alert("Erro ao carregar coordenadores");
            });
    }
    </script>

    <script>
        function excluirCoordenador(id) {
            if (!confirm("Tem certeza que deseja excluir?")) return;

            fetch(`http://localhost:5036/api/coordenadores/${id}`, {
                method: "DELETE"
            })
            .then(res => {
                if (res.ok) {
                    alert("Coordenador excluído com sucesso!");
                    carregarCoordenadores();
                } else {
                    alert("Erro ao excluir");
                }
            })
            .catch(err => {
                console.error(err);
                alert("Erro de conexão");
            });
        }
    </script>

    <script>
        window.onload = function () {
            carregarCoordenadores();
        };
    </script>

</body>
</html>
