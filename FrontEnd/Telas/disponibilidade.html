<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoinClass - Disponibilidade Professor</title>
    <!-- Reaproveitando nosso style.css -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Cabeçalho Principal -->
    
        <div class="Topo1Acesso">
        <img src="img/JCLogoSF.png" alt="Logo" class="LogoLogin">
    </div>
   

    <!-- Conteúdo da Página -->
    <main class="container form-container">
        
        <div class="form-card availability-card">
            <!-- Título Externo/Superior como na imagem -->
            <div class="header-badge">Professor</div>
            
            <h1 class="form-title">Disponibilidade</h1>

            <form onsubmit="salvarDisponibilidade(event)">

                <!-- Grupo de Checkboxes Organizados -->
                <div class="checkbox-container">
                    
                    <!-- Linha 1: Segunda, Terça e Quarta -->
                    <div class="checkbox-row">
                        <label class="checkbox-item">
                            <input type="checkbox" name="disponibilidade" value="segunda">
                            <span class="custom-checkbox"></span>
                            Segunda-feira
                        </label>

                        <label class="checkbox-item">
                            <input type="checkbox" name="disponibilidade" value="terca">
                            <span class="custom-checkbox"></span>
                            Terça-feira
                        </label>

                        <label class="checkbox-item">
                            <input type="checkbox" name="disponibilidade" value="quarta">
                            <span class="custom-checkbox"></span>
                            Quarta-feira
                        </label>
                    </div>

                    <!-- Linha 2: Quinta e Sexta -->
                    <div class="checkbox-row center-row">
                        <label class="checkbox-item">
                            <input type="checkbox" name="disponibilidade" value="quinta">
                            <span class="custom-checkbox"></span>
                            Quinta-feira
                        </label>

                        <label class="checkbox-item">
                            <input type="checkbox" name="disponibilidade" value="sexta">
                            <span class="custom-checkbox"></span>
                            Sexta-feira
                        </label>
                    </div>

                    <div class="form-group">
                        <label>Horário Início</label>
                        <input type="time" id="horario_inicio" required>
                    </div>

                    <div class="form-group">
                        <label>Horário Fim</label>
                        <input type="time" id="horario_fim" required>
                    </div>

                    <div class="form-group">
                        <label>ID do Professor</label>
                        <input type="number" id="id_professor" required>
                    </div>

                </div>

                <!-- Botão de Ação -->
                <div class="form-actions">
                    <button type="submit" class="btn-submit">Salvar</button>
                </div>
            </form>

        </div>

        <div id="mensagem"></div>

    </main>

    <script>
        async function salvarDisponibilidade(event) {
    event.preventDefault();

    const diasSelecionados = [...document.querySelectorAll('input[name="disponibilidade"]:checked')]
        .map(cb => cb.value);

    const horarioInicio = document.getElementById("horario_inicio").value;
    const horarioFim = document.getElementById("horario_fim").value;
    const idProfessor = document.getElementById("id_professor").value;

    const mensagem = document.getElementById("mensagem");

    try {
        console.log({
            diasSelecionados,
            horarioInicio,
            horarioFim,
            idProfessor
        });

        const response = await fetch("http://localhost:5036/api/Disponibilidades", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                dias: diasSelecionados,
                horario_inicio: horarioInicio,
                horario_fim: horarioFim,
                id_professor: parseInt(idProfessor)
            })
        });

        if (response.ok) {
            mensagem.innerHTML = "✅ Disponibilidade cadastrada com sucesso!";
            mensagem.style.color = "green";

            // limpar formulário
            document.querySelector("form").reset();
        } else {
           const erro = await response.text();
            mensagem.innerHTML = " " + erro;
            mensagem.style.color = "red";
        }

    } catch (error) {
        mensagem.innerHTML = "Erro de conexão com a API.";
        mensagem.style.color = "red";
        console.error(error);
    }
}
    </script>
</body>
</html>
