<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>JoinClass Login</title>

	<link rel="stylesheet" type="text/css" href="CSS/JoinClass.css">
</head>

<body class="BodyLogin">

    <div class="TopoLogin">
        <img src="imgJC/JCLogoSF.png" alt="Logo"class="LogoLogin">
    </div>

    
    <div class="CardLogin">

        <h1>Login</h1>

        <div class="CampoLogin">
            <label>E-mail:</label>
            <input type="email" id="email">
        </div>

        <div class="CampoLogin">
            <label>Senha:</label>
            <input type="password" id="senha">
        </div>

        <div class="CampoLogin">
            <label>Nome:</label>
            <input type="text" id="nome">
        </div>

         <div class="BotaoEntrar">

            <button onclick="login()">Entrar</button>

        </div>

		<div class="TextoCadastro">
			<a href="JC1Acesso.html">
            <p>Primeira vez acessando?</p>
            </a>
        </div>

    </div>
<script>
async function login() {

    const email = document.querySelector("#email").value;
    const senha = document.querySelector("#senha").value;
    const nome = document.querySelector("#nome").value;

    const response = await fetch("http://localhost:5036/api/professores/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, senha, nome })
    });

    if (response.ok) {
        const user = await response.json();
        alert("Login OK: " + user.nome);
    } else {
        alert("Email ou senha inválidos");
    }
}
</script>
</body>
</html>
