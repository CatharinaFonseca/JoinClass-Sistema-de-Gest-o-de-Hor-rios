<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoinClass - Matriz Curricular</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Cabeçalho Principal (Reutilizando a estrutura da anterior) -->

        <div class="Topo1Acesso">
        <img src="img/JCLogoSF.png" alt="Logo" class="LogoLogin">
    </div>

    <!-- Conteúdo da Página -->
    <main class="container form-container">
        
        <!-- Card Central do Formulário -->
        <div class="form-card">
            <h1 class="form-title">Matriz Curricular</h1>
            
            <h2 class="form-subtitle">Identificação</h2>
            <hr class="form-divider">

            <form onsubmit="salvarMatrizCurricular(event)">
                <!-- Linha 1: Curso e Modalidade -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="curso">Curso:</label>
                        <input type="text" id="curso" class="form-input">
                    </div>
                </div>

                <!-- Linha 2: Carga Horária e Grau -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="carga-horaria">Carga Horária:</label>
                        <input type="text" id="carga-horaria" class="form-input">
                    </div>
                    
                    <div class="form-group">
                        <label for="semestre">Semestre:</label>
                        <input type="text" id="semestre" class="form-input">
                    </div>
                </div>

                <!-- Botão de Ação -->
                <div class="form-actions">
                    <button type="submit" class="btn-submit">Enviar</button>
                </div>
            </form>

        </div>

    </main>
<script>
    async function salvarMatrizCurricular(event) {
    event.preventDefault();

    const cursoInput = document.getElementById('curso');
    const cargaHorariaInput = document.getElementById('carga-horaria');
    const semestreInput = document.getElementById('semestre');

    const dadosMatriz = {
        id_graduacao: parseInt(cursoInput.value) || 0,
        id_disponibilidade: parseInt(cargaHorariaInput.value) || 0,
        id_disciplina: parseInt(semestreInput.value) || 0
    };

    const urlApi = 'http://localhost:5036/api/MatrizCurricular';

    try {
        const response = await fetch(urlApi, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dadosMatriz)
        });

        if (response.ok) {
            const resultado = await response.json();
            alert('Matriz Curricular enviada e salva com sucesso!');
            console.log('Sucesso:', resultado);
            
            event.target.reset();
        } else if (response.status === 400) {
            const erroValidacao = await response.json();
            alert('Erro de validação nos dados enviados.');
            console.error('Erros do ModelState:', erroValidacao);
        } else {
            alert('Ocorreu um erro no servidor ao tentar salvar.');
        }

    } catch (error) {
        console.error('Erro ao conectar com a API:', error);
        alert('Não foi possível conectar ao servidor da API.');
    }
}
</script>

</body>
</html>r
