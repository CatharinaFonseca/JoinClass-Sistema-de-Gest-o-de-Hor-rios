<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoinClass - Disciplinas</title>
    <!-- Vinculando o mesmo arquivo de estilo compartilhado -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <!-- Cabeçalho Principal -->

        <div class="TopoAcesso">
        <a href="JoinClass.html">
    <img src="img/JCLogoSF.png" alt="Logo" class="LogoLogin">
        </a>
    </div>


    <!-- Conteúdo da Página -->
    <main class="container form-container">
        
        <!-- Card Central do Formulário -->
        <div class="form-card">
            <h1 class="form-title">Disciplina</h1>
            
            <h2 class="form-subtitle">Identificação</h2>
            <hr class="form-divider">

            <form onsubmit="salvarDisciplina(event)">
                <!-- Linha 1: Nome e Curso -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome-disciplina">Nome:</label>
                        <input type="text" id="nome-disciplina" class="form-input">
                    </div>
                    
                    <!--<div class="form-group">
                        <label for="curso-disciplina">Curso:</label>
                        <input type="text" id="curso-disciplina" class="form-input">
                    </div>
                </div>-->

                <!-- Linha 2: Carga Horária -->
                <div class="form-row">
                    <div class="form-group" style="max-width: 50%; margin: 0 auto;">
                        <label for="carga-disciplina">Carga Horária:</label>
                        <input type="text" id="carga-disciplina" class="form-input">
                    </div>
                </div>

                <!-- Botão de Ação -->
                <div class="form-actions">
                    <button type="submit" class="btn-submit">Cadastrar</button>
                </div>
            </form>

        </div>

        <h2>Lista de Disciplinas</h2>

        <table border="1" style="width:100%; margin-top:10px;">
            <thead>
                <tr>
                    <th>Nome</th>
                    <!-- <th>Curso</th> -->
                    <th>Carga Horária</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
</table>

    </main>
     <script>
    function carregarDisciplinas() {
        fetch("http://localhost:5036/api/disciplinas")
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById("corpoTabela");
                tbody.innerHTML = "";

                data.forEach(disc => {
                    const tr = document.createElement("tr");

                    tr.innerHTML = `
                        <td>${disc.nome}</td>
                        <td>${disc.carga_horaria}</td>
                        <td>
                            <button onclick="excluirDisciplina(${disc.id})">
                                Excluir
                            </button>
                        </td>
                    `;

                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                console.error(err);
                alert("Erro ao carregar disciplinas");
            });
    }
    </script>

    <script>
        function excluirDisciplina(id) {
            if (!confirm("Tem certeza que deseja excluir?")) return;

            fetch(`http://localhost:5036/api/disciplinas/${id}`, {
                method: "DELETE"
            })
            .then(res => {
                if (res.ok) {
                    alert("Disciplina excluída com sucesso!");
                    carregarDisciplinas();
                } else {
                    alert("Erro ao excluir");
                }
            })
            .catch(err => {
                console.error(err);
                alert("Erro de conexão");
            });
        }
    </script>

    <script>
        window.onload = carregarDisciplinas;
    </script>
</body>
</html>
